<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a10"><meta name="description" content="Descubra filmes e séries, assista a trailers e crie sua lista."><meta property="og:title" content="CineSearch"><meta property="og:description" content="Seu catálogo inteligente de cinema."><meta property="og:type" content="website"><title>CineSearch — Filmes e séries</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="index.css"><script defer src="index.js"></script></head>
<body><div class="watermark" aria-hidden="true">Caio Daniel</div><a class="skip-link" href="#catalogo">Ir para o catálogo</a><header class="header"><nav class="header__inner"><button class="brand" id="homeBtn">Cine<span>Search</span></button><form class="search" id="searchForm"><input id="searchInput" type="search" placeholder="Busque filmes e séries" aria-label="Buscar"><button>Buscar</button></form><button id="installBtn" class="install-btn hidden">Instalar</button><button id="favoritesBtn" class="favorites-btn">Minha lista <b id="favoritesCount">0</b></button></nav></header>
<main><section id="hero" class="hero"><div class="hero__shade"></div><div class="hero__content"><span class="eyebrow">Destaque da semana</span><h1 id="heroTitle">Seu próximo filme favorito está aqui.</h1><p id="heroOverview">Explore títulos populares, avaliações e trailers.</p><div id="heroMeta"></div><div class="hero__actions"><button id="watchTrailerBtn" class="btn primary">▶ Assistir trailer</button><button id="heroDetailsBtn" class="btn glass">ⓘ Mais informações</button></div></div></section>
<section class="content" id="catalogo"><div class="categories" id="categories"><button class="category-btn active" data-feed="trending">Em alta</button><button class="category-btn" data-feed="popular">Populares</button><button class="category-btn" data-feed="top_rated">Mais avaliados</button><button class="category-btn" data-feed="now_playing">Nos cinemas</button><button class="category-btn" data-genre="28">Ação</button><button class="category-btn" data-genre="35">Comédia</button><button class="category-btn" data-genre="27">Terror</button><button class="category-btn" data-genre="10749">Romance</button><button class="category-btn" data-feed="series">Séries</button></div>
<form id="filtersForm" class="filters"><label>Ano<input id="yearFilter" type="number" min="1900" max="2030" placeholder="Todos"></label><label>Nota mínima<select id="ratingFilter"><option value="0">Todas</option><option value="6">6+</option><option value="7">7+</option><option value="8">8+</option></select></label><label>Ordenar<select id="sortFilter"><option value="popularity.desc">Popularidade</option><option value="vote_average.desc">Melhor avaliação</option><option value="primary_release_date.desc">Mais recentes</option></select></label><button type="submit">Aplicar</button><button type="reset" id="resetFilters">Limpar</button></form>
<section id="favoritesSection" class="hidden"><div class="section-heading"><h2>Minha lista</h2><button id="clearFavorites">Limpar lista</button></div><div id="favoritesGrid" class="movies-grid"></div></section><section><div class="section-heading"><div><span class="kicker">Descubra agora</span><h2 id="sectionTitle">Em alta hoje</h2></div><span id="resultCount"></span></div><div id="movieGrid" class="movies-grid"></div><button id="loadMoreBtn" class="load-more hidden">Carregar mais</button></section></section></main>
<footer><p>Dados fornecidos por TMDB.</p><p>Desenvolvido por <strong>Caio Daniel</strong></p></footer><button id="scrollTopBtn" class="scroll-top">↑</button><div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true"><div class="modal"><button id="modalClose" class="modal-close" aria-label="Fechar">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast" role="status" aria-live="polite"></div></body></html>
